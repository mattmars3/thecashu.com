<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <ul class="site-nav-list">
      {%- if config.extra.header_links is defined %}
      {%- for link in config.extra.header_links %}
      <li class="site-nav-item">
        {%- if not loop.first %}
        <span class="site-nav-dot" aria-hidden="true">&middot;</span>
        {%- endif %}
        <a href="{{ link.path }}">{{ link.name }}</a>
      </li>
      {%- endfor %}
      {%- endif %}
      {%- if config.extra.feed_path is defined %}
      <li class="site-nav-item">
        <span class="site-nav-dot" aria-hidden="true">&middot;</span>
        <a class="feed-btn" href="{{ config.extra.feed_path }}/atom.xml" title="Atom feed" aria-label="Atom feed">
          <span class="feed-icon" aria-hidden="true"></span>
        </a>
      </li>
      {%- endif %}
    </ul>
  </nav>
</header>
