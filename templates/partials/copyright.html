<span>&copy; {{ now() | date(format="%Y") }} <a href="{{ config.extra.copyright_url | default(value=config.base_url) }}">{{ config.extra.copyright_holder | default(value=config.title) }}</a>{% if config.extra.footer_links is defined -%}{% for link in config.extra.footer_links %} &middot; <a href="{{ link.path }}">{{ link.name }}</a>{% endfor -%}{% endif %}{% if config.extra.feed_path is defined %} &middot; <a class="feed-btn" href="{{ config.extra.feed_path }}/atom.xml" title="Atom feed"><span class="feed-icon"></span></a>{% endif %}</span>
